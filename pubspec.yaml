name: Stop10
description: Stop 10 — arrête le chronomètre le plus près possible de 10,00 secondes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_icon_foreground.png

# --- Icône de l'application (Android uniquement — ios: false) ---
# Commande : flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#07070F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# --- Splash screen (natif, avant le splash animé Flutter) ---
# Commande : flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#07070F"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#07070F"
    image: assets/icon/app_icon_foreground.png
  android: true
  ios: false
